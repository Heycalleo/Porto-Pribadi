<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tantangan</title>
  <link rel="stylesheet" href="syle.css">
</head>
<body>
  <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;">
    <div style="max-width:720px; width:100%; background: rgba(8,20,45,0.96); padding:1.2rem; border-radius:12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); color:var(--color);">
      <h2>Tantangan</h2>
      <p style="font-weight:700;">temukan bug ato data yg bisa bocor</p>
      <p style="opacity:0.85; margin-top:0.4rem;">Jika kamu menemukan sesuatu, silakan tekan <strong>Accept</strong> dan laporkan detailnya melalui feedback di halaman utama.</p>
      <p style="opacity:0.9; margin-top:0.4rem; font-weight:600;">Jika melapor, harap sertakan: <em>mengapa hal ini bisa terjadi</em> dan <em>apa yang harus kita perbaiki?</p>
      <div style="margin-top:0.8rem; display:flex; gap:0.6rem;">
        <button id="acceptBtn" class="button">Accept</button>
        <a href="index.html" class="button button-secondary">Kembali</a>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('acceptBtn');
      btn && btn.addEventListener('click', () => {
        try { localStorage.setItem('tantangan_accepted', new Date().toISOString()); } catch (e) {}
        alert('Terima kasih — silakan kirim detail bug/data yang ditemukan melalui halaman Feedback.');
        window.location.href = 'index.html#feedback';
      });
    });
  </script>
</body>
</html>
